<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayWhisper – Demo</title>
<style>
:root{--bg:#f3f7f6;--card:#ffffff;--ink:#12283a;--mute:#5c7080;--line:#d9e3e8;--accent:#0e8f7e;--accent-ink:#ffffff;--warn:#b4561b;--warnbg:#fdf1e6;--ok:#0e8f7e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a24;--card:#152532;--ink:#e8f1f5;--mute:#93a9b8;--line:#25394a;--accent:#2fd0b8;--accent-ink:#06211c;--warn:#f0a56b;--warnbg:#2c2016;--ok:#2fd0b8}}
:root[data-theme="dark"]{--bg:#0d1a24;--card:#152532;--ink:#e8f1f5;--mute:#93a9b8;--line:#25394a;--accent:#2fd0b8;--accent-ink:#06211c;--warn:#f0a56b;--warnbg:#2c2016;--ok:#2fd0b8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:2rem;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 14px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem;margin-bottom:18px}
.mic{display:block;margin:10px auto;width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;cursor:pointer}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,143,126,.5)}100%{box-shadow:0 0 0 26px rgba(14,143,126,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--ink)}}
.hint{text-align:center;color:var(--mute);font-size:.9rem;min-height:1.4em}
.row{display:flex;gap:8px;margin:14px 0}
input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
button.btn{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.big{font-size:1.9rem;font-weight:700}
.warnline{color:var(--warn);font-weight:600;margin:6px 0}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
.examples button{margin:4px 4px 0 0;font-size:.85rem;padding:8px 10px}
h2{font-size:1rem;margin:22px 0 6px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>PayWhisper</h1>
<p class="sub">Pay by voice. Say it, check it, confirm it.</p>
<div class="banner">Demo mode: payments are simulated. No real money moves.</div>

<button class="mic" id="mic" aria-label="Start speaking">🎤</button>
<div class="hint" id="hint">Tap the mic and say a payment, or type below.</div>

<div class="row">
<input id="txt" placeholder="e.g. Send 25 dollars to Priya" aria-label="Payment command">
<button class="btn pri" id="go">Parse</button>
</div>
<div class="examples">
<button class="btn" data-q="Send 25 dollars to Priya">Send 25 to Priya</button>
<button class="btn" data-q="Pay Rahul 500 rupees">Pay Rahul 500 rupees</button>
<button class="btn" data-q="Send 250 dollars to Amit">Send 250 to Amit</button>
</div>

<div id="out"></div>

<h2>Recent payments</h2>
<ul id="hist"><li><span class="hint">Nothing yet.</span></li></ul>
</main>

<script>
const LIMIT = 100; // amounts above this need a second confirmation
const SYM = {dollars:'$',dollar:'$',usd:'$',rupees:'₹',rupee:'₹',inr:'₹',rs:'₹',euros:'€',euro:'€'};
const $ = id => document.getElementById(id);
const hist = [];

function parse(text){
  const t = text.trim();
  const amt = t.match(/(\d+(?:\.\d{1,2})?)\s*(dollars?|usd|rupees?|inr|rs|euros?)?/i);
  if(!amt) return null;
  const amount = parseFloat(amt[1]);
  const cur = (amt[2]||'dollars').toLowerCase();
  let name = null;
  let m = t.match(/\bto\s+([a-z][a-z .'-]*)$/i);
  if(m) name = m[1];
  if(!name){ m = t.match(/\bpay\s+([a-z][a-z .'-]*?)\s+\d/i); if(m) name = m[1]; }
  if(!name) return null;
  name = name.trim().replace(/\b\w/g,c=>c.toUpperCase());
  return {amount, sym:SYM[cur]||'$', name};
}

function show(text){
  const p = parse(text);
  const out = $('out');
  out.textContent = '';
  if(!p || p.amount<=0){
    out.innerHTML = '<div class="card"><strong>Couldn’t understand that.</strong><p class="sub">Try “Send 25 dollars to Priya” or “Pay Rahul 500 rupees”.</p></div>';
    return;
  }
  const big = p.amount > LIMIT;
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<div class="sub">I heard: “'+text.replace(/</g,'&lt;')+'”</div>'+
    '<div class="big">'+p.sym+p.amount+' → '+p.name+'</div>'+
    (big?'<div class="warnline">Large amount. Please confirm twice before sending.</div>':'')+
    '<div class="actions"><button class="btn" id="no">Cancel</button><button class="btn pri" id="yes">'+(big?'Confirm amount':'Confirm')+'</button></div>';
  out.appendChild(c);
  $('no').onclick = () => { out.textContent=''; $('hint').textContent='Cancelled. Nothing was sent.'; };
  $('yes').onclick = () => {
    if(big){
      c.querySelector('.warnline').textContent = 'Final check: send '+p.sym+p.amount+' to '+p.name+'?';
      $('yes').textContent = 'Yes, send it';
      $('yes').onclick = () => done(p);
    } else done(p);
  };
}

function done(p){
  $('out').innerHTML = '<div class="card"><div class="ok big">Sent (simulated)</div><p class="sub">'+p.sym+p.amount+' to '+p.name+'. Demo receipt only.</p></div>';
  hist.unshift(p);
  $('hist').innerHTML = hist.map(h=>'<li><span>'+h.name+'</span><span class="ok">'+h.sym+h.amount+'</span></li>').join('');
}

$('go').onclick = () => { if($('txt').value.trim()) show($('txt').value); };
$('txt').onkeydown = e => { if(e.key==='Enter') $('go').click(); };
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('txt').value=b.dataset.q;show(b.dataset.q);});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic');
if(!SR){
  mic.disabled = true; mic.style.opacity = .4;
  $('hint').textContent = 'Voice isn’t supported in this browser. Type a command instead.';
} else {
  const rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false;
  rec.onstart = () => { mic.classList.add('on'); $('hint').textContent = 'Listening…'; };
  rec.onend = () => mic.classList.remove('on');
  rec.onerror = () => { $('hint').textContent = 'Mic blocked or unavailable. Type a command instead.'; };
  rec.onresult = e => { const s = e.results[0][0].transcript; $('txt').value = s; show(s); };
  mic.onclick = () => { try{ rec.start(); }catch(_){} };
}
</script>
</body>
</html>
